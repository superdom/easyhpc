---
# Common role handlers

- name: Restart chrony service
  ansible.builtin.systemd:
    name: chronyd
    state: restarted

- name: Notify limits configuration updated
  ansible.builtin.debug:
    msg: >-
      System limits configuration updated at /etc/security/limits.d/slurm.conf.
      New limits will apply to new login sessions (PAM applies limits at login time).
  # Note: limits.conf is applied by PAM at login time, not dynamically reloadable.
  # sysctl is for kernel parameters, not ulimits.

- name: Reload sysctl kernel parameters
  ansible.builtin.command: sysctl --system
  register: sysctl_reload_result
  changed_when: sysctl_reload_result.rc == 0

- name: Display sysctl reload errors if any
  ansible.builtin.debug:
    msg: "sysctl reload warnings: {{ sysctl_reload_result.stderr_lines | default([]) }}"
  when:
    - sysctl_reload_result is defined
    - sysctl_reload_result.stderr_lines | default([]) | length > 0
  listen: Reload sysctl kernel parameters

- name: Restart SSH daemon
  ansible.builtin.systemd:
    name: sshd
    state: restarted

