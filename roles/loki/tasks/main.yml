---
- name: Install and configure Loki
  when: loki_enabled | bool
  block:
    - name: Create Loki directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ loki_config_dir }}"
          owner: root
          group: root
          mode: "0755"
        - path: "{{ loki_data_dir }}"
          owner: "{{ loki_uid }}"
          group: "{{ loki_gid }}"
          mode: "0755"
        - path: /opt/loki
          owner: root
          group: root
          mode: "0755"

    - name: Deploy Loki config
      ansible.builtin.template:
        src: loki.yml.j2
        dest: "{{ loki_config_dir }}/loki.yml"
        mode: "0644"
      notify: restart loki

    - name: Deploy Docker Compose file for Loki
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: /opt/loki/docker-compose.yml
        mode: "0644"
      notify: restart loki

    - name: Start Loki with Docker Compose
      block:
        - name: Start Loki with Docker Compose v2
          community.docker.docker_compose_v2:
            project_src: /opt/loki
            state: present
            pull: always
          register: docker_compose_result
          changed_when: docker_compose_result.changed
      rescue:
        - name: Start Loki with Docker Compose (fallback)
          ansible.builtin.command: docker compose -f /opt/loki/docker-compose.yml up -d
          args:
            chdir: /opt/loki
          register: docker_compose_fallback
          changed_when: "'Creating' in docker_compose_fallback.stdout or 'Starting' in docker_compose_fallback.stdout"

    - name: Wait for Loki to be ready
      ansible.builtin.wait_for:
        port: "{{ loki_http_port }}"
        host: localhost
        delay: 3
        timeout: 30

    - name: Verify Loki is running
      ansible.builtin.uri:
        url: "http://localhost:{{ loki_http_port }}/ready"
        status_code: 200
      register: loki_check
      changed_when: false
      until: loki_check.status == 200
      retries: 10
      delay: 3

    - name: Display Loki status
      ansible.builtin.debug:
        msg: "Loki: {{ 'Running' if loki_check.status == 200 else 'Not Running' }}"
