- name: Ensure Grafana data directory ownership for container user
  ansible.builtin.file:
    path: "{{ grafana_data_dir | default('/var/lib/grafana') }}"
    state: directory
    owner: "472"
    group: "472"
    mode: "0755"
    recurse: true
