---
# NVIDIA Container Toolkit role defaults

nvidia_container_toolkit_enabled: false

# Install only on GPU nodes
nvidia_container_toolkit_require_gpu: true
nvidia_container_toolkit_skip_if_no_gpu: true

# Package versioning
nvidia_container_toolkit_package_state: "present"  # present or latest
nvidia_container_toolkit_version: ""  # optional explicit version

# Repository configuration
nvidia_container_toolkit_repo_base_url: "https://nvidia.github.io/libnvidia-container/stable"
nvidia_container_toolkit_gpgkey_url: "https://nvidia.github.io/libnvidia-container/gpgkey"
nvidia_container_toolkit_gpgkey_path: "/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg"
nvidia_container_toolkit_repo_list_url: "{{ nvidia_container_toolkit_repo_base_url }}/deb/nvidia-container-toolkit.list"
nvidia_container_toolkit_repo_list_path: "/etc/apt/sources.list.d/nvidia-container-toolkit.list"
nvidia_container_toolkit_repo_rpm_url: "{{ nvidia_container_toolkit_repo_base_url }}/rpm/nvidia-container-toolkit.repo"

# Runtime configuration
nvidia_container_toolkit_configure_docker: true
nvidia_container_toolkit_configure_containerd: false
nvidia_container_toolkit_restart_runtime: true
