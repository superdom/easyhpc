---
# NVIDIA DCGM Exporter Role (Docker)
# Only runs on compute nodes (slurm-node group)

- name: Verify this is a compute node
  ansible.builtin.fail:
    msg: "This role should only run on nodes in the 'slurm-node' group"
  when: not (is_slurm_compute | default(false))

- name: Check if NVIDIA GPU is present
  ansible.builtin.shell: lspci | grep -i nvidia
  register: nvidia_check
  changed_when: false
  failed_when: false

- name: Check if NVIDIA driver is installed
  ansible.builtin.command: nvidia-smi
  register: nvidia_driver_check
  changed_when: false
  failed_when: false

- name: Compute NVIDIA presence flags
  ansible.builtin.set_fact:
    nvidia_gpu_present: "{{ (nvidia_check | default({})).get('rc', 1) == 0 }}"
    nvidia_driver_present: "{{ (nvidia_driver_check | default({})).get('rc', 1) == 0 }}"

- name: Skip when no NVIDIA GPU or driver is found
  ansible.builtin.debug:
    msg: "Skipping dcgm-exporter: NVIDIA GPU or driver not detected."
  when:
    - not nvidia_gpu_present or not nvidia_driver_present

- name: End dcgm-exporter role when no NVIDIA GPU or driver is found
  ansible.builtin.meta: end_role
  when:
    - not nvidia_gpu_present or not nvidia_driver_present

- name: Create dcgm-exporter directory
  ansible.builtin.file:
    path: /opt/dcgm-exporter
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: nvidia_driver_present

- name: Deploy Docker Compose file for dcgm-exporter
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/dcgm-exporter/docker-compose.yml
    mode: '0644'
  when: nvidia_driver_present
  notify: restart dcgm-exporter

- name: Start dcgm-exporter with Docker Compose
  when: nvidia_driver_present
  block:
    - name: Start dcgm-exporter with Docker Compose v2
      community.docker.docker_compose_v2:
        project_src: /opt/dcgm-exporter
        state: present
        pull: always
      register: docker_compose_result
      changed_when: docker_compose_result.changed
  rescue:
    - name: Start dcgm-exporter with Docker Compose (fallback)
      ansible.builtin.command: docker compose -f /opt/dcgm-exporter/docker-compose.yml up -d
      args:
        chdir: /opt/dcgm-exporter
      register: docker_compose_fallback
      changed_when: "'Creating' in docker_compose_fallback.stdout or 'Starting' in docker_compose_fallback.stdout"

- name: Wait for DCGM Exporter to be ready
  ansible.builtin.wait_for:
    port: "{{ dcgm_exporter_port }}"
    host: localhost
    delay: 5
    timeout: 30
  when: nvidia_driver_present

- name: Verify DCGM Exporter is running
  ansible.builtin.uri:
    url: "http://localhost:{{ dcgm_exporter_port }}/metrics"
    status_code: 200
  register: dcgm_exporter_check
  changed_when: false
  when: nvidia_driver_present

- name: Display DCGM Exporter status
  ansible.builtin.debug:
    msg: "DCGM Exporter: {{ 'Running' if dcgm_exporter_check.status == 200 else 'Not Running' if nvidia_driver_present else 'NVIDIA Driver Not Installed' }}"
  when: nvidia_driver_present
