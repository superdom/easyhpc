---
# Post: reboot handling

- name: Check if reboot is required (Ubuntu)
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: ubuntu_reboot_required
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Set reboot flag based on Ubuntu reboot-required file
  ansible.builtin.set_fact:
    nvidia_reboot_required: true
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - ubuntu_reboot_required.stat.exists

- name: Check if kernel was updated
  ansible.builtin.shell: |
    if [ -d /boot ] && ls /boot/vmlinuz-* >/dev/null 2>&1; then
      RUNNING_KERNEL=$(uname -r)
      LATEST_KERNEL=$(ls -t /boot/vmlinuz-* | head -n1 | sed 's/.*vmlinuz-//')
      [ "$RUNNING_KERNEL" != "$LATEST_KERNEL" ] && echo "kernel_mismatch" || echo "kernel_ok"
    else
      echo "kernel_unknown"
    fi
  register: kernel_check
  changed_when: false

- name: Set reboot flag if kernel was updated
  ansible.builtin.set_fact:
    nvidia_reboot_required: true
  when: kernel_check.stdout == 'kernel_mismatch'

- name: Display reboot status
  ansible.builtin.debug:
    msg:
      - "Reboot required: {{ nvidia_reboot_required | default(false) }}"
      - "Reason: {% if ubuntu_reboot_required.stat.exists | default(false) %}System reboot required{% elif kernel_check.stdout == 'kernel_mismatch' %}Kernel updated{% elif nouveau_loaded | default(false) %}Nouveau driver was loaded{% else %}Driver installed or updated{% endif %}"

- name: Reboot the system
  ansible.builtin.reboot:
    reboot_timeout: "{{ nvidia_driver_reboot_timeout }}"
    msg: "Rebooting to complete NVIDIA driver installation"
    pre_reboot_delay: 5
    post_reboot_delay: 30
  when:
    - nvidia_reboot_required | default(false)
    - not nvidia_driver_skip_reboot

- name: Wait for system to become reachable
  ansible.builtin.wait_for_connection:
    timeout: "{{ nvidia_driver_reboot_timeout }}"
  when:
    - nvidia_reboot_required | default(false)
    - not nvidia_driver_skip_reboot

- name: Verify system is back online
  ansible.builtin.ping:
  when:
    - nvidia_reboot_required | default(false)
    - not nvidia_driver_skip_reboot

- name: Wait for NVIDIA driver to initialize
  ansible.builtin.pause:
    seconds: 10
  when: nvidia_driver_validate_installation
