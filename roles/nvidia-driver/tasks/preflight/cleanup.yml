---
# Preflight: cleanup and nouveau handling

- name: Check for nouveau driver
  ansible.builtin.shell: lsmod | grep -w nouveau
  register: nouveau_check
  changed_when: false
  failed_when: false

- name: Set nouveau status fact
  ansible.builtin.set_fact:
    nouveau_loaded: "{{ nouveau_check.rc == 0 }}"

- name: Warning if nouveau is loaded
  ansible.builtin.debug:
    msg: "WARNING: Nouveau driver is currently loaded. It will be blacklisted."
  when: nouveau_loaded

- name: Blacklist nouveau driver
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-nouveau.conf
    content: |
      blacklist nouveau
      options nouveau modeset=0
    mode: '0644'
  when:
    - nvidia_gpu_detected
    - nvidia_driver_blacklist_nouveau
  notify: Update initramfs for NVIDIA driver
  register: nouveau_blacklist

- name: Set reboot flag if nouveau blacklist changed
  ansible.builtin.set_fact:
    nvidia_reboot_required: true
  when:
    - nvidia_gpu_detected
    - nvidia_driver_blacklist_nouveau
    - nouveau_blacklist is defined
    - nouveau_blacklist.changed

- name: Remove nouveau driver if loaded
  ansible.builtin.shell: |
    if lsmod | grep -q nouveau; then
      rmmod nouveau || echo "Could not unload nouveau, reboot required"
    fi
  when:
    - nvidia_gpu_detected
    - nvidia_driver_remove_nouveau
    - nouveau_loaded | default(false)
  register: nouveau_removal
  changed_when: "'Could not unload' not in nouveau_removal.stdout"
  failed_when: false

- name: Set reboot required flag if nouveau couldn't be unloaded
  ansible.builtin.set_fact:
    nvidia_reboot_required: true
  when:
    - nouveau_removal is defined
    - "'stdout' in nouveau_removal"
    - "'Could not unload' in nouveau_removal.stdout"

- name: Cleanup old NVIDIA drivers (Ubuntu)
  ansible.builtin.apt:
    name: "nvidia-*"
    state: absent
    purge: true
  when:
    - nvidia_gpu_detected
    - nvidia_driver_cleanup_old_drivers
    - ansible_facts['distribution'] == 'Ubuntu'

- name: Cleanup old NVIDIA drivers (RHEL/Rocky)
  ansible.builtin.dnf:
    name:
      - "nvidia-*"
      - "kmod-nvidia-*"
    state: absent
  when:
    - nvidia_gpu_detected
    - nvidia_driver_cleanup_old_drivers
    - ansible_facts['os_family'] == 'RedHat'

- name: Set reboot required after cleanup
  ansible.builtin.set_fact:
    nvidia_reboot_required: true
  when:
    - nvidia_gpu_detected
    - nvidia_driver_cleanup_old_drivers

- name: Unhold NVIDIA packages before clean install (Ubuntu)
  ansible.builtin.shell: |
    holds=$(apt-mark showhold | grep -E '^(nvidia|libnvidia|xserver-xorg-video-nvidia)' || true)
    if [ -n "$holds" ]; then
      echo "$holds" | xargs -r apt-mark unhold
    fi
    echo "$holds"
  register: nvidia_driver_unhold_clean
  changed_when: nvidia_driver_unhold_clean.stdout | length > 0
  when:
    - nvidia_gpu_detected
    - nvidia_driver_clean_install_effective
    - ansible_facts['distribution'] == 'Ubuntu'

- name: Stop NVIDIA services before clean install (Ubuntu)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - nvidia-persistenced
    - nvidia-fabricmanager
  failed_when: false
  when:
    - nvidia_gpu_detected
    - nvidia_driver_clean_install_effective
    - ansible_facts['distribution'] == 'Ubuntu'

- name: Purge NVIDIA packages before clean install (Ubuntu)
  ansible.builtin.apt:
    name:
      - "nvidia-*"
      - "libnvidia-*"
      - "xserver-xorg-video-nvidia-*"
      - "linux-modules-nvidia-*"
      - "linux-modules-extra-*nvidia*"
      - "nvidia-dkms-*"
      - "nvidia-kernel-*"
      - "nvidia-utils-*"
      - "nvidia-compute-utils-*"
      - "libnvidia-nscq-*"
    state: absent
    purge: true
  register: nvidia_driver_clean_remove
  when:
    - nvidia_gpu_detected
    - nvidia_driver_clean_install_effective
    - ansible_facts['distribution'] == 'Ubuntu'

- name: Autoremove after clean install purge (Ubuntu)
  ansible.builtin.apt:
    autoremove: true
  when:
    - nvidia_gpu_detected
    - nvidia_driver_clean_install_effective
    - ansible_facts['distribution'] == 'Ubuntu'

- name: Set reboot required after clean install purge
  ansible.builtin.set_fact:
    nvidia_reboot_required: true
  when:
    - nvidia_gpu_detected
    - nvidia_driver_clean_install_effective
    - nvidia_driver_clean_remove is defined
    - nvidia_driver_clean_remove.changed
