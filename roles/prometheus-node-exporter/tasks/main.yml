---
- name: Create node-exporter directory
  ansible.builtin.file:
    path: /opt/node-exporter
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy Docker Compose file for node-exporter
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/node-exporter/docker-compose.yml
    mode: '0644'
  notify: restart node_exporter

- name: Start node-exporter with Docker Compose
  block:
    - name: Start node-exporter with Docker Compose v2
      community.docker.docker_compose_v2:
        project_src: /opt/node-exporter
        state: present
        pull: always
      register: docker_compose_result
      changed_when: docker_compose_result.changed
  rescue:
    - name: Start node-exporter with Docker Compose (fallback)
      ansible.builtin.command: docker compose -f /opt/node-exporter/docker-compose.yml up -d
      args:
        chdir: /opt/node-exporter
      register: docker_compose_fallback
      changed_when: "'Creating' in docker_compose_fallback.stdout or 'Starting' in docker_compose_fallback.stdout"

- name: Wait for Node Exporter to be ready
  ansible.builtin.wait_for:
    port: "{{ node_exporter_port }}"
    host: localhost
    delay: 5
    timeout: 30

- name: Verify Node Exporter is running
  ansible.builtin.uri:
    url: "http://localhost:{{ node_exporter_port }}/metrics"
    status_code: 200
  register: node_exporter_check
  changed_when: false

- name: Display Node Exporter status
  ansible.builtin.debug:
    msg: "Node Exporter: {{ 'Running' if node_exporter_check.status == 200 else 'Not Running' }}"
