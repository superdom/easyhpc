---
# Prometheus SLURM Exporter Role (package install)
# Only runs on controller node (slurm-controller group)

- name: Verify this is a controller node
  ansible.builtin.fail:
    msg: "This role should only run on nodes in the 'slurm-controller' group"
  when: not (is_slurm_controller | default(false))

- name: Validate exporter prerequisite policy
  ansible.builtin.assert:
    that:
      - slurm_exporter_prereq_policy in ['skip', 'fail']
    fail_msg: "Invalid slurm_exporter_prereq_policy='{{ slurm_exporter_prereq_policy }}'. Use 'skip' or 'fail'."

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Determine Slurm prerequisite status
  ansible.builtin.set_fact:
    slurm_exporter_slurmctld_service_exists: "{{ slurm_exporter_required_slurmctld_service in (ansible_facts.services | default({})) }}"

- name: Build Slurm prerequisite result
  ansible.builtin.set_fact:
    slurm_exporter_prereq_ok: "{{ slurm_exporter_slurmctld_service_exists }}"
    slurm_exporter_prereq_missing: >-
      {{
        (not slurm_exporter_slurmctld_service_exists)
        | ternary(['service not found: ' ~ slurm_exporter_required_slurmctld_service], [])
      }}

- name: Fail when Slurm prerequisites are missing
  ansible.builtin.fail:
    msg: "Cannot install prometheus-slurm-exporter. Missing prerequisites: {{ slurm_exporter_prereq_missing | join('; ') }}"
  when:
    - not slurm_exporter_prereq_ok
    - slurm_exporter_prereq_policy == 'fail'

- name: Skip exporter installation when Slurm prerequisites are missing
  ansible.builtin.debug:
    msg: "Skipping prometheus-slurm-exporter: {{ slurm_exporter_prereq_missing | join('; ') }}"
  when:
    - not slurm_exporter_prereq_ok
    - slurm_exporter_prereq_policy == 'skip'

- name: Install and start Prometheus SLURM Exporter
  when: slurm_exporter_prereq_ok
  block:
    - name: Determine package architecture
      ansible.builtin.set_fact:
        slurm_exporter_arch: >-
          {{ 'amd64' if ansible_facts['architecture'] in ['x86_64', 'amd64']
             else 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64']
             else '' }}

    - name: Fail if architecture is unsupported
      ansible.builtin.fail:
        msg: "Unsupported architecture for prometheus-slurm-exporter: {{ ansible_facts['architecture'] }}"
      when: slurm_exporter_arch == ''

    - name: Set package URL (Debian)
      ansible.builtin.set_fact:
        slurm_exporter_pkg_url: >-
          https://github.com/rivosinc/prometheus-slurm-exporter/releases/download/v{{ slurm_exporter_version }}/prometheus-slurm-exporter_{{ slurm_exporter_version }}_linux_{{ slurm_exporter_arch }}.deb
        slurm_exporter_pkg_path: "/tmp/prometheus-slurm-exporter_{{ slurm_exporter_version }}_{{ slurm_exporter_arch }}.deb"
      when: ansible_facts['os_family'] == "Debian"

    - name: Set package URL (RedHat)
      ansible.builtin.set_fact:
        slurm_exporter_pkg_url: >-
          https://github.com/rivosinc/prometheus-slurm-exporter/releases/download/v{{ slurm_exporter_version }}/prometheus-slurm-exporter_{{ slurm_exporter_version }}_linux_{{ slurm_exporter_arch }}.rpm
        slurm_exporter_pkg_path: "/tmp/prometheus-slurm-exporter_{{ slurm_exporter_version }}_{{ slurm_exporter_arch }}.rpm"
      when: ansible_facts['os_family'] == "RedHat"

    - name: Download SLURM exporter package
      ansible.builtin.get_url:
        url: "{{ slurm_exporter_pkg_url }}"
        dest: "{{ slurm_exporter_pkg_path }}"
        mode: '0644'
      when: slurm_exporter_pkg_url is defined

    - name: Install SLURM exporter package (Debian)
      ansible.builtin.apt:
        deb: "{{ slurm_exporter_pkg_path }}"
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Install SLURM exporter package (RedHat)
      ansible.builtin.yum:
        name: "{{ slurm_exporter_pkg_path }}"
        state: present
        disable_gpg_check: true
      when: ansible_facts['os_family'] == "RedHat"

    - name: Install systemd unit for SLURM exporter
      ansible.builtin.template:
        src: prometheus-slurm-exporter.service.j2
        dest: "/etc/systemd/system/{{ slurm_exporter_service_name }}.service"
        mode: '0644'

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Ensure SLURM exporter service is enabled and running
      ansible.builtin.systemd:
        name: "{{ slurm_exporter_service_name }}"
        state: started
        enabled: true

    - name: Wait for SLURM Exporter to be ready
      ansible.builtin.wait_for:
        port: "{{ slurm_exporter_port }}"
        host: localhost
        delay: 3
        timeout: 30
      ignore_errors: true

    - name: Verify SLURM Exporter is running
      ansible.builtin.uri:
        url: "http://localhost:{{ slurm_exporter_port }}/metrics"
        status_code: 200
      register: slurm_exporter_check
      changed_when: false
      failed_when: false

    - name: Display SLURM Exporter status
      ansible.builtin.debug:
        msg: "SLURM Exporter: {{ 'Running' if slurm_exporter_check.status == 200 else 'Not Running' }}"
